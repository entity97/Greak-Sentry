# ---------------------------------------------------------------------------
# Free games (from GamerPower, no key needed)
# platforms: steam, epic-games-store, gog, ubisoft, battlenet, origin, itchio,
#            pc (all PC stores), ps4, ps5, xbox-one, xbox-series-xs, switch
# ---------------------------------------------------------------------------
[free_games]
enabled = true
platforms = ["steam", "epic-games-store", "gog", "ubisoft"]
check_every_minutes = 60
ping = ""                          # e.g. "@everyone", or a role name like "Free Games"


# ---------------------------------------------------------------------------
# Patch notes (from each game's official Steam announcements, no key needed)
# ---------------------------------------------------------------------------
[patch_notes]
enabled = true
only_patch_notes = true            # true = skip events/sales news, keep updates and patches
check_every_minutes = 30
ping_game_role = true              # Ping the game's role when its patch drops


# ---------------------------------------------------------------------------
# Twitch go-live alerts
# Works without keys, but adding TWITCH_CLIENT_ID and TWITCH_CLIENT_SECRET
# to .env makes it faster and more reliable (see README).
# ---------------------------------------------------------------------------
[twitch]
enabled = true
username = "greakarmo"
check_every_minutes = 2
ping = "@everyone"
message = "{ping} **GreakArmo is live!** Come hang out 👇"


# ---------------------------------------------------------------------------
# YouTube uploads (from the channel's public feed, no key needed)
# ---------------------------------------------------------------------------
[youtube]
enabled = true
channel_id = "UCc6dBLAvBIzjQ7zXO2TBNgQ"
check_every_minutes = 10
ping = "@everyone"
message = "{ping} **New video just dropped!** 🎬"


# ---------------------------------------------------------------------------
# Moderation for aggressive language
# Mods, admins, and anyone with an exempt role are never flagged.
# ---------------------------------------------------------------------------
[moderation]
enabled = true
# Which channels to watch. * is a wildcard: "rally-*" = every rally channel,
# and "banter" covers the #banter in every game.
channels = ["open-comms", "rally-*", "banter", "mess-hall", "recon-photos", "field-radio"]
exempt_roles = ["Admin", "Moderator"]

# Normal strikes: message deleted + warning. Too many strikes in a day = timeout.
strikes_before_timeout = 3
strike_window_hours = 24
timeout_minutes = 10
warning_seconds = 10               # How long the warning message stays before it deletes itself

# Severe: message deleted + instant timeout
severe_timeout_minutes = 60

# Words and phrases. Matching ignores caps, repeated letters (fuuuck),
# and common swaps like 0 for o or 1 for i. Add your own anytime.
warn_terms = [
  "fuck you", "fuck off", "stfu", "shut the fuck up", "shut up bitch",
  "piece of shit", "dumbass", "retard", "retarded",
  "trash human", "worthless", "uninstall and die",
]
severe_terms = [
  "kys", "kill yourself", "kill urself", "neck yourself", "hope you die",
  "i will kill you", "im going to kill you", "go die",
  # Add slurs here. They get deleted with an instant timeout.
]
