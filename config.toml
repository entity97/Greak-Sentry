# Greak Sentry settings
# ---------------------
# Everything you'd want to change lives in this file. Secrets (your bot token,
# Twitch keys) do NOT go here. They go in the .env file, which never gets uploaded.
#
# Channel and role names are matched without the "#" and ignore upper/lower case.
# Run !setup in your server after changing channels or roles, and the bot will
# create anything that's missing.

[bot]
prefix = "!"                       # Commands look like !setup, !freegames
admin_roles = ["Admin", "Moderator"]   # These roles (and the server owner) can use admin commands


# ---------------------------------------------------------------------------
# Channels the bot posts in. Change the names on the right to match your server.
# ---------------------------------------------------------------------------
[channels]
welcome     = "fresh-recruits"
rules       = "rules-of-engagement"
roles       = "armoury"
free_games  = "supply-drops"
patch_notes = ""                   # Optional shared channel for games without their own (see [[games]])
live        = "live-ops"           # Twitch go-live posts
youtube     = "mission-footage"    # New YouTube uploads
mod_log     = "incident-reports"   # Private channel where the bot logs moderation actions


# ---------------------------------------------------------------------------
# Permissions (applied by !setup, or on their own with !lockdown)
# Category names just need to be part of the real name. Emojis and caps don't matter.
# ---------------------------------------------------------------------------
[permissions]
# Everyone can read and react, but only the bot can post.
bot_only_categories = ["Deployment Zone", "Command Center"]   # everything inside each category
bot_only_channels   = ["intel"]            # the #intel in every game. * works here too.

# Only the server owner, admin_roles (see [bot]), and the bot can see these.
hidden_categories = ["High Command"]


# ---------------------------------------------------------------------------
# Welcome + rules check
# New members get welcomed, then react to the rules message to get the
# Verified role. Lock voice channels to that role with !lockvoice.
# ---------------------------------------------------------------------------
[welcome]
message = """
Welcome to the squad, {user}! 🎮

Head over to {rules} and react with ✅ to accept the rules. That unlocks the voice channels.
Then grab your game roles in {roles}.
"""

[verification]
role  = "Verified"
emoji = "✅"
rules_text = """
**Server Rules**

1. Be respectful. Trash talk the game, not the people.
2. No hate speech, slurs, harassment, or threats.
3. No spam or self-promotion without permission.
4. Keep content in the right channels.
5. Follow Fluxer's Terms of Service.

React with ✅ below to agree. This unlocks the voice channels.
"""


# ---------------------------------------------------------------------------
# Game roles
# Each game gets a role people can pick by reacting in the roles channel.
# steam_appid is used for patch notes. Leave it out (or set 0) to skip patch notes.
# patch_channel is where that game's patch notes go. The bot looks for it inside
# the game's category, so every game can use the same name (like "intel").
# "category" just needs to be part of the category's name; emojis and caps don't matter.
# To add a game later: copy a block, change it, then run !setup again.
# ---------------------------------------------------------------------------
[[games]]
name = "Battlefield 6"
role = "Battlefield 6"
emoji = "💥"
steam_appid = 2807960
patch_channel = "intel"
category = "Battlefield 6"

